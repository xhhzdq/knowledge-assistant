[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "knowledge-assistant"
version = "0.1.0"
description = "A learning project for building an enterprise document knowledge assistant."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.14",
    "fastapi>=0.116",
    "minio>=7.2,<8.0",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.0",
    "python-multipart>=0.0.20",
    "redis>=8.1,<9.0",
    "sqlalchemy>=2.0",
    "uvicorn>=0.35",
]

[project.optional-dependencies]
dev = [
    "httpx2>=2.0",
    "mypy>=1.15",
    "pytest>=8.3",
    "ruff>=0.11",
]

[project.scripts]
knowledge-assistant = "knowledge_assistant.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
packages = ["knowledge_assistant"]
strict = true
